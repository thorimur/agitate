name = "agitate"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["agitate", "agitate-nonmodule", "modulate", "agitate-check", "agitate-deps"]

[[lean_lib]]
name = "Agitate"

# Dependency graphs at scale; depends only on Lean, so that it can move upstream (Percolate.lean).
[[lean_lib]]
name = "Percolate"

# `#guard` tests of Percolate, run by `scripts/test-percolate.sh` (not a default target).
[[lean_lib]]
name = "PercolateTest"

[[lean_exe]]
name = "agitate"
root = "Main"
# loading a `lakefile.lean` evaluates it in-process
supportInterpreter = true

# Differential checker: the olean index against a real environment (see AgitateCheck.lean).
[[lean_exe]]
name = "agitate-check"
root = "AgitateCheck"
supportInterpreter = true

# Import minimizer for code not using the module system (see Agitate/NonModule.lean).
[[lean_exe]]
name = "agitate-nonmodule"
root = "NonModuleMain"
supportInterpreter = true

# Converts non-module files to the module system (`modulize` + `agitate`; see Agitate/Shake.lean).
[[lean_exe]]
name = "modulate"
root = "ModulateMain"
supportInterpreter = true

# Which source declarations of a project given declarations need (see Agitate/Deps/Main.lean).
[[lean_exe]]
name = "agitate-deps"
root = "DepsMain"
supportInterpreter = true
