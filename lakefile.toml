name = "agitate"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["agitate", "agitate-nonmodule", "modulate", "agitate-check", "percolate"]

[[lean_lib]]
name = "Agitate"

# `#guard` tests of `Agitate.ImportGraph`, run by `scripts/test-importgraph.sh` (not a default target).
[[lean_lib]]
name = "AgitateTest"
globs = ["AgitateTest.+"]

[[lean_exe]]
name = "agitate"
root = "Main"
# loading a `lakefile.lean` evaluates it in-process
supportInterpreter = true

# Differential checker: the olean index against a real environment (see AgitateCheck.lean).
[[lean_exe]]
name = "agitate-check"
root = "AgitateCheck"
supportInterpreter = true

# Import minimizer for code not using the module system (see Agitate/NonModule.lean).
[[lean_exe]]
name = "agitate-nonmodule"
root = "NonModuleMain"
supportInterpreter = true

# Converts non-module files to the module system (`modulize` + `agitate`; see Agitate/Shake.lean).
[[lean_exe]]
name = "modulate"
root = "ModulateMain"
supportInterpreter = true

# Which source declarations of a project given declarations need (see Agitate/Percolate/Main.lean).
[[lean_exe]]
name = "percolate"
root = "PercolateMain"
supportInterpreter = true
